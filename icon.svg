<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16212e"/>
      <stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9dde"/>
      <stop offset="1" stop-color="#4fd18b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9dde" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4fd18b" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#4f9dde" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Верхняя крышка -->
  <rect x="128" y="92" width="256" height="36" rx="10" fill="#4f9dde"/>
  <rect x="148" y="128" width="216" height="6" rx="3" fill="#4f9dde" opacity="0.4"/>

  <!-- Стекло часов -->
  <path d="M 168 134 L 344 134 L 344 150
           Q 344 200 300 244 Q 288 256 288 272
           L 288 240 Q 288 224 300 212 Q 344 168 344 150"
        fill="url(#glass)" stroke="#4f9dde" stroke-width="6" stroke-linejoin="round" opacity="0"/>

  <!-- Контур часов -->
  <path d="M 168 134 L 344 134
           Q 344 210 260 256
           Q 344 302 344 378
           L 168 378
           Q 168 302 252 256
           Q 168 210 168 134 Z"
        fill="none" stroke="#4f9dde" stroke-width="10" stroke-linejoin="round"/>

  <!-- Песок сверху (полный) -->
  <path d="M 186 152 L 326 152
           Q 326 200 262 246
           Q 256 250 256 256
           Q 256 250 250 246
           Q 186 200 186 152 Z"
        fill="url(#sand)"/>

  <!-- Песок снизу (горка) -->
  <path d="M 190 360 Q 256 300 322 360 Z" fill="url(#sand)"/>

  <!-- Падающая струйка -->
  <rect x="252" y="256" width="8" height="60" fill="url(#sand)" opacity="0.85"/>

  <!-- Нижняя крышка -->
  <rect x="148" y="378" width="216" height="6" rx="3" fill="#4f9dde" opacity="0.4"/>
  <rect x="128" y="384" width="256" height="36" rx="10" fill="#4f9dde"/>

  <!-- Блики на стекле -->
  <path d="M 200 160 L 200 210" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round"/>
  <path d="M 200 320 L 200 356" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6" stroke-linecap="round"/>
</svg>